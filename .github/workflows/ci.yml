name: Antibandwidth SAT CI

on:
  push:
    branches: [ main, master, Loi_ABP ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Linting & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Check syntax errors
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Unit & Pipeline Tests (Python 3.11)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          python -m pytest tests/

      - name: CLI Smoke Test (Harwell-Boeing Instances)
        run: |
          python main.py -i data/instance/harwell-boeing_v2/jgl009.txt --check-k 1 --solver cadical153
          python main.py -i data/instance/harwell-boeing_v2/jgl009.txt --check-k 1 --encoding scl --solver cadical153
          python main.py -i data/instance/harwell-boeing_v2/jgl009.txt --check-k 1 --encoding cpsat
